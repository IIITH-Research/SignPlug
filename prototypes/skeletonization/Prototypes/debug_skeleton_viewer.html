<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeleton Frame Debugger</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #181818;
      --panel: #242424;
      --panel-2: #303030;
      --border: #565656;
      --text: #f0f0f0;
      --muted: #b8b8b8;
      --accent: #6bb7ff;
      --button: #3a3a3a;
      --button-hover: #4a4a4a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 16px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 14px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .toolbar,
    .viewer,
    .side-panel,
    .timeline {
      border: 1px solid var(--border);
      background: var(--panel);
    }

    .toolbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(180px, 360px) minmax(160px, 1fr) auto auto auto;
      gap: 10px;
      align-items: end;
      padding: 12px;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    select,
    input[type="file"],
    input[type="number"],
    input[type="text"] {
      width: 100%;
      min-height: 32px;
      border: 1px solid var(--border);
      background: #1d1d1d;
      color: var(--text);
      padding: 6px 8px;
      font-size: 13px;
    }

    button {
      min-width: 38px;
      min-height: 32px;
      border: 1px solid var(--border);
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .viewer {
      min-height: 560px;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #101010;
      padding: 12px;
    }

    canvas {
      background: #000;
      image-rendering: auto;
      max-width: 100%;
      max-height: 76vh;
      border: 1px solid #3b3b3b;
    }

    .side-panel {
      display: grid;
      align-content: start;
      gap: 12px;
      padding: 12px;
    }

    .panel-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
      background: var(--panel-2);
    }

    .info-grid div {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }

    .info-grid div:nth-child(odd) {
      color: var(--muted);
      border-right: 1px solid var(--border);
    }

    .info-grid div:nth-last-child(-n + 2) {
      border-bottom: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .timeline {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 12px;
    }

    .slider-wrap {
      display: grid;
      gap: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .ticks {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
    }

    .hidden-video {
      display: none;
    }

    .status {
      min-height: 58px;
      border: 1px solid var(--border);
      background: #1d1d1d;
      padding: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .timeline {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="toolbar">
      <label>
        Generated video
        <select id="videoSelect">
          <option value="Outputs/3views/apple_skeleton_3views.mp4" selected>Prototypes/Outputs/3views/apple_skeleton_3views.mp4</option>
          <option value="Outputs/3views/red_skeleton_3views.mp4">Prototypes/Outputs/3views/red_skeleton_3views.mp4</option>
          <option value="Outputs/apple_skeleton_3views.mp4">Prototypes/Outputs/apple_skeleton_3views.mp4</option>
          <option value="Outputs/apple_pure_3d.mp4">Prototypes/Outputs/apple_pure_3d.mp4</option>
          <option value="Outputs/apple_hybrid_skeleton.mp4">Prototypes/Outputs/apple_hybrid_skeleton.mp4</option>
          <option value="Outputs/redSkeleton_full_normalized.mp4">Prototypes/Outputs/redSkeleton_full_normalized.mp4</option>
        </select>
      </label>

      <label>
        Or load local video
        <input id="fileInput" type="file" accept="video/*" />
      </label>

      <button id="reloadBtn" type="button">Reload</button>
      <button id="fitBtn" type="button">Fit</button>
      <button id="actualBtn" type="button">100%</button>
    </section>

    <section class="viewer">
      <canvas id="frameCanvas" width="1500" height="500"></canvas>
      <video id="video" class="hidden-video" muted playsinline preload="auto"></video>
    </section>

    <aside class="side-panel">
      <h1 class="panel-title">Frame Information</h1>
      <div class="info-grid">
        <div>Current Frame</div>
        <div id="currentFrame">0</div>
        <div>Total Frames</div>
        <div id="totalFrames">-</div>
        <div>Time</div>
        <div id="currentTime">0.000 s</div>
        <div>Duration</div>
        <div id="duration">-</div>
        <div>FPS</div>
        <div id="fpsValue">25</div>
        <div>Resolution</div>
        <div id="resolution">-</div>
        <div>Zoom</div>
        <div id="zoomValue">Fit</div>
      </div>

      <label>
        FPS used for frame stepping
        <input id="fpsInput" type="number" min="1" max="120" step="1" value="25" />
      </label>

      <label>
        Jump to frame
        <input id="frameInput" type="number" min="0" value="0" />
      </label>

      <div class="controls">
        <button id="firstBtn" type="button">|&lt;</button>
        <button id="prevBtn" type="button">&lt;</button>
        <button id="nextBtn" type="button">&gt;</button>
        <button id="lastBtn" type="button">&gt;|</button>
      </div>

      <button id="playBtn" type="button">Play</button>
      <button id="saveFrameBtn" type="button">Save Current Frame PNG</button>
      <div id="status" class="status">Load a generated skeleton video, then scrub frame by frame.</div>
    </aside>

    <section class="timeline">
      <span id="leftFrame">0</span>
      <div class="slider-wrap">
        <input id="frameSlider" type="range" min="0" max="0" value="0" step="1" />
        <div class="ticks">
          <span>First</span>
          <span>Middle</span>
          <span>Last</span>
        </div>
      </div>
      <span id="rightFrame">0</span>
    </section>
  </main>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("frameCanvas");
    const ctx = canvas.getContext("2d");
    const videoSelect = document.getElementById("videoSelect");
    const fileInput = document.getElementById("fileInput");
    const frameSlider = document.getElementById("frameSlider");
    const frameInput = document.getElementById("frameInput");
    const fpsInput = document.getElementById("fpsInput");
    const statusBox = document.getElementById("status");
    const currentFrameEl = document.getElementById("currentFrame");
    const totalFramesEl = document.getElementById("totalFrames");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const fpsValueEl = document.getElementById("fpsValue");
    const resolutionEl = document.getElementById("resolution");
    const zoomValueEl = document.getElementById("zoomValue");
    const leftFrameEl = document.getElementById("leftFrame");
    const rightFrameEl = document.getElementById("rightFrame");
    const playBtn = document.getElementById("playBtn");

    let fps = Number(fpsInput.value);
    let totalFrames = 0;
    let currentFrame = 0;
    let fitMode = true;
    let objectUrl = null;
    let seekToken = 0;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function frameToTime(frame) {
      return Math.max(0, frame) / fps;
    }

    function timeToFrame(time) {
      return Math.min(totalFrames - 1, Math.max(0, Math.round(time * fps)));
    }

    function updateInfo() {
      currentFrameEl.textContent = String(currentFrame);
      totalFramesEl.textContent = totalFrames > 0 ? String(totalFrames) : "-";
      currentTimeEl.textContent = `${video.currentTime.toFixed(3)} s`;
      durationEl.textContent = Number.isFinite(video.duration) ? `${video.duration.toFixed(3)} s` : "-";
      fpsValueEl.textContent = String(fps);
      resolutionEl.textContent = video.videoWidth && video.videoHeight ? `${video.videoWidth} x ${video.videoHeight}` : "-";
      zoomValueEl.textContent = fitMode ? "Fit" : "100%";
      frameInput.value = String(currentFrame);
      frameSlider.value = String(currentFrame);
    }

    function resizeCanvasToVideo() {
      const width = video.videoWidth || 1500;
      const height = video.videoHeight || 500;
      canvas.width = width;
      canvas.height = height;

      if (fitMode) {
        canvas.style.width = "100%";
        canvas.style.height = "auto";
      } else {
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
      }
    }

    function drawFrame() {
      if (!video.videoWidth || !video.videoHeight) {
        return;
      }
      resizeCanvasToVideo();
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      updateInfo();
    }

    function configureTimeline() {
      totalFrames = Math.max(1, Math.floor(video.duration * fps));
      frameSlider.max = String(totalFrames - 1);
      frameSlider.value = "0";
      frameInput.max = String(totalFrames - 1);
      leftFrameEl.textContent = "0";
      rightFrameEl.textContent = String(totalFrames - 1);
      currentFrame = 0;
      updateInfo();
    }

    function drawDecodedFrame(token, frame) {
      let hasDrawn = false;
      const draw = () => {
        if (hasDrawn) {
          return;
        }
        if (token !== seekToken) {
          return;
        }
        hasDrawn = true;
        currentFrame = frame;
        drawFrame();
        setStatus(`Showing frame ${frame} at ${video.currentTime.toFixed(3)} s`);
      };

      if ("requestVideoFrameCallback" in video) {
        video.requestVideoFrameCallback(draw);
      } else {
        requestAnimationFrame(draw);
      }
      window.setTimeout(draw, 120);
    }

    function seekToFrame(frame) {
      if (!Number.isFinite(video.duration)) {
        return;
      }

      const nextFrame = Math.min(totalFrames - 1, Math.max(0, Number(frame)));
      const token = ++seekToken;
      const maxTime = Math.max(0, video.duration - 0.001);
      const targetTime = Math.min(maxTime, frameToTime(nextFrame) + 0.0005);

      currentFrame = nextFrame;
      video.pause();
      playBtn.textContent = "Play";
      updateInfo();

      const onSeeked = () => {
        if (token !== seekToken) {
          return;
        }
        drawDecodedFrame(token, nextFrame);
      };

      video.addEventListener("seeked", onSeeked, { once: true });

      if (Math.abs(video.currentTime - targetTime) < 0.0001) {
        video.removeEventListener("seeked", onSeeked);
        drawDecodedFrame(token, nextFrame);
        return;
      }

      video.currentTime = targetTime;
      window.setTimeout(() => {
        if (token === seekToken) {
          drawDecodedFrame(token, nextFrame);
        }
      }, 350);
    }

    function loadVideo(src, label) {
      video.pause();
      playBtn.textContent = "Play";
      currentFrame = 0;
      totalFrames = 0;
      setStatus(`Loading ${label} ...`);
      video.src = src;
      video.load();
    }

    function loadSelectedVideo() {
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
      loadVideo(videoSelect.value, videoSelect.options[videoSelect.selectedIndex].textContent);
    }

    video.addEventListener("loadedmetadata", () => {
      configureTimeline();
      seekToFrame(0);
      setStatus(`Loaded ${video.currentSrc}`);
    });

    video.addEventListener("timeupdate", () => {
      if (!video.paused) {
        currentFrame = timeToFrame(video.currentTime);
        drawFrame();
      }
    });

    video.addEventListener("ended", () => {
      playBtn.textContent = "Play";
      currentFrame = totalFrames - 1;
      updateInfo();
    });

    video.addEventListener("error", () => {
      setStatus("Could not load this video. If opened directly as a file, try running a local server from the project root.");
    });

    frameSlider.addEventListener("input", () => seekToFrame(Number(frameSlider.value)));
    frameInput.addEventListener("change", () => seekToFrame(Number(frameInput.value)));

    fpsInput.addEventListener("change", () => {
      fps = Math.max(1, Number(fpsInput.value) || 25);
      fpsInput.value = String(fps);
      configureTimeline();
      seekToFrame(currentFrame);
    });

    document.getElementById("reloadBtn").addEventListener("click", loadSelectedVideo);
    videoSelect.addEventListener("change", loadSelectedVideo);

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) {
        return;
      }
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
      }
      objectUrl = URL.createObjectURL(file);
      loadVideo(objectUrl, file.name);
    });

    document.getElementById("firstBtn").addEventListener("click", () => seekToFrame(0));
    document.getElementById("prevBtn").addEventListener("click", () => seekToFrame(currentFrame - 1));
    document.getElementById("nextBtn").addEventListener("click", () => seekToFrame(currentFrame + 1));
    document.getElementById("lastBtn").addEventListener("click", () => seekToFrame(totalFrames - 1));

    playBtn.addEventListener("click", () => {
      if (video.paused) {
        video.play();
        playBtn.textContent = "Pause";
      } else {
        video.pause();
        playBtn.textContent = "Play";
        currentFrame = timeToFrame(video.currentTime);
        seekToFrame(currentFrame);
      }
    });

    document.getElementById("fitBtn").addEventListener("click", () => {
      fitMode = true;
      resizeCanvasToVideo();
      updateInfo();
    });

    document.getElementById("actualBtn").addEventListener("click", () => {
      fitMode = false;
      resizeCanvasToVideo();
      updateInfo();
    });

    document.getElementById("saveFrameBtn").addEventListener("click", () => {
      const link = document.createElement("a");
      link.download = `skeleton_frame_${String(currentFrame).padStart(4, "0")}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.tagName === "INPUT" || event.target.tagName === "SELECT") {
        return;
      }
      if (event.key === "ArrowLeft") {
        seekToFrame(currentFrame - 1);
      }
      if (event.key === "ArrowRight") {
        seekToFrame(currentFrame + 1);
      }
      if (event.key === " ") {
        event.preventDefault();
        playBtn.click();
      }
    });

    loadSelectedVideo();
  </script>
</body>
</html>

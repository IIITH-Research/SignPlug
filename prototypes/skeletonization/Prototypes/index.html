<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ISL 3D Avatar (State-Driven Architecture)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: Arial, sans-serif; }
        
        /* Debug UI Panel */
        #debugUI { 
            position: absolute; bottom: 20px; left: 20px; 
            background: rgba(0, 0, 0, 0.85); padding: 20px; 
            border-radius: 8px; color: white; z-index: 100;
            width: 450px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }
        
        /* Hide UI when debugMode is false */
        body.live-mode #debugUI { display: none; }

        #status { margin: 0 0 15px 0; font-size: 16px; color: #00ffcc; border-bottom: 1px solid #444; padding-bottom: 10px;}
        
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        button { 
            background: #444; color: white; border: none; 
            padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;
            flex-grow: 1; transition: background 0.2s;
        }
        button:hover { background: #666; }
        button:active { background: #00ffcc; color: black; }
        .record-btn { background: #882222; }
        .record-btn:hover { background: #aa3333; }
        .recording-active { background: #ff0000 !important; animation: pulse 1s infinite alternate; }

        @keyframes pulse { from { opacity: 1; } to { opacity: 0.6; } }
        
        #frameSlider { width: 100%; cursor: pointer; margin-bottom: 10px; accent-color: #00ffcc; }
        
        .info-panel { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 5px;}
        .shortcuts { font-size: 12px; color: #777; margin-top: 15px; text-align: center; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="debugUI">
        <h2 id="status">⏳ Initializing Engine...</h2>
        
        <div class="controls">
            <button id="btnPrev">⏪ Prev</button>
            <button id="btnPlayPause">▶️ Play</button>
            <button id="btnNext">Next ⏩</button>
        </div>
        
        <div class="info-panel">
            <span id="frameLabel">Frame: 0</span>
            <span id="timeLabel">0.00s</span>
        </div>
        <input type="range" id="frameSlider" min="0" max="100" value="0" step="1" disabled />
        
        <div class="controls" style="margin-top: 15px;">
            <button id="btnRecord" class="record-btn">⏺️ Start Recording (R)</button>
            <button id="btnSave">💾 Save Video (S)</button>
        </div>

        <div class="shortcuts">
            Shortcuts: [Space] Play/Pause | [⬅️/➡️] Step Frames | [R] Record | [S] Save
        </div>
    </div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ==========================================
// 1. ARCHITECTURE CONFIGURATION
// ==========================================
const CONFIG = {
    debugMode: true,    // true = UI and manual controls. false = clean screen, auto-loop.
    fps: 25,            // Strict target framerate
    frameTime: 1 / 25   // Math: 0.04 seconds per frame
};

// Apply UI visibility based on config
if (!CONFIG.debugMode) {
    document.body.classList.add("live-mode");
}

// Global State
let state = {
    currentFrame: 0,
    maxFrame: 0,
    isPlaying: !CONFIG.debugMode, // Auto-play if in live mode
    isRecording: false,
    isLoaded: false
};

// ==========================================
// 2. SCENE SETUP
// ==========================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); // Preserve buffer required for recording
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(100, 100, 100);
scene.add(dirLight);
scene.add(new THREE.GridHelper(300, 60));

// ==========================================
// 3. THE RIG MAP
// ==========================================
const rigMap = [
    {jsonKey:  "RightShoulderGlobalRotations", targetName: "RightShoulder_034"},
    { jsonKey: "RightUpperArmLocalRotations", targetName: "RightArm_035" },
    { jsonKey: "RightForeArmLocalRotations", targetName: "RightForeArm_036" },
    { jsonKey: "RightThumbBaseLocalRotations", targetName: "RightHandThumb1_038" }, { jsonKey: "RightThumbMcpLocalRotations", targetName: "RightHandThumb2_039" }, { jsonKey: "RightThumbIpLocalRotations", targetName: "RightHandThumb3_040" }, { jsonKey: "RightThumbTipLocalRotations", targetName: "RightHandThumb4_041" },
    { jsonKey: "RightIndexBaseLocalRotations", targetName: "RightHandIndex1_042" }, { jsonKey: "RightIndexMcpLocalRotations", targetName: "RightHandIndex2_043" }, { jsonKey: "RightIndexDipLocalRotations", targetName: "RightHandIndex3_044" }, { jsonKey: "RightIndexTipLocalRotations", targetName: "RightHandIndex4_045" },
    { jsonKey: "RightMiddleBaseLocalRotations", targetName: "RightHandMiddle1_046" }, { jsonKey: "RightMiddleMcpLocalRotations", targetName: "RightHandMiddle2_047" }, { jsonKey: "RightMiddleDipLocalRotations", targetName: "RightHandMiddle3_048" }, { jsonKey: "RightMiddleTipLocalRotations", targetName: "RightHandMiddle4_049" },
    { jsonKey: "RightRingBaseLocalRotations", targetName: "RightHandRing1_050" }, { jsonKey: "RightRingMcpLocalRotations", targetName: "RightHandRing2_051" }, { jsonKey: "RightRingDipLocalRotations", targetName: "RightHandRing3_052" }, { jsonKey: "RightRingTipLocalRotations", targetName: "RightHandRing4_053" },
    { jsonKey: "RightPinkyBaseLocalRotations", targetName: "RightHandPinky1_054" }, { jsonKey: "RightPinkyMcpLocalRotations", targetName: "RightHandPinky2_055" }, { jsonKey: "RightPinkyDipLocalRotations", targetName: "RightHandPinky3_056" }, { jsonKey: "RightPinkyTipLocalRotations", targetName: "RightHandPinky4_00" }, 
    
    {jsonKey: "LeftShoulderGlobalRotations", targetName: "LeftShoulder_010"},
    { jsonKey: "LeftUpperArmLocalRotations", targetName: "LeftArm_011" },
    { jsonKey: "LeftForeArmLocalRotations", targetName: "LeftForeArm_012" },
    { jsonKey: "LeftThumbBaseLocalRotations", targetName: "LeftHandThumb1_014" }, { jsonKey: "LeftThumbMcpLocalRotations", targetName: "LeftHandThumb2_015" }, { jsonKey: "LeftThumbIpLocalRotations", targetName: "LeftHandThumb3_016" }, { jsonKey: "LeftThumbTipLocalRotations", targetName: "LeftHandThumb4_017" },
    { jsonKey: "LeftIndexBaseLocalRotations", targetName: "LeftHandIndex1_018" }, { jsonKey: "LeftIndexMcpLocalRotations", targetName: "LeftHandIndex2_019" }, { jsonKey: "LeftIndexDipLocalRotations", targetName: "LeftHandIndex3_020" }, { jsonKey: "LeftIndexTipLocalRotations", targetName: "LeftHandIndex4_021" },
    { jsonKey: "LeftMiddleBaseLocalRotations", targetName: "LeftHandMiddle1_022" }, { jsonKey: "LeftMiddleMcpLocalRotations", targetName: "LeftHandMiddle2_023" }, { jsonKey: "LeftMiddleDipLocalRotations", targetName: "LeftHandMiddle3_024" }, { jsonKey: "LeftMiddleTipLocalRotations", targetName: "LeftHandMiddle4_025" },
    { jsonKey: "LeftRingBaseLocalRotations", targetName: "LeftHandRing1_026" }, { jsonKey: "LeftRingMcpLocalRotations", targetName: "LeftHandRing2_027" }, { jsonKey: "LeftRingDipLocalRotations", targetName: "LeftHandRing3_028" }, { jsonKey: "LeftRingTipLocalRotations", targetName: "LeftHandRing4_029" },
    { jsonKey: "LeftPinkyBaseLocalRotations", targetName: "LeftHandPinky1_030" }, { jsonKey: "LeftPinkyMcpLocalRotations", targetName: "LeftHandPinky2_031" }, { jsonKey: "LeftPinkyDipLocalRotations", targetName: "LeftHandPinky3_032" }, { jsonKey: "LeftPinkyTipLocalRotations", targetName: "LeftHandPinky4_033" }
];

// ==========================================
// 4. LOAD ASSETS
// ==========================================
let character = null;
let animationData = null;
let loadedCount = 0;

function checkLoadComplete() {
    loadedCount++;
    if (loadedCount === 2) {
        state.isLoaded = true;
        state.maxFrame = animationData["RightForeArmLocalRotations"].length - 1;
        
        // Initialize UI
        const slider = document.getElementById("frameSlider");
        slider.max = state.maxFrame;
        slider.disabled = false;
        document.getElementById("status").innerText = `✅ Ready (${state.maxFrame + 1} Frames @ ${CONFIG.fps} FPS)`;
        
        // Force render frame 0
        updateFrame(0);
    }
}

let defaultGlobalQuaternions = {};
let calculatedLocalQuaternions = {}; // We will build this mathematically!

new GLTFLoader().load("./male2k.glb", (gltf) => {
    character = gltf.scene;
    scene.add(character);
    
    // STEP 1: Force the engine to calculate absolute world matrices
    character.updateMatrixWorld(true);
    
    // STEP 2: Extract ONLY the Default Global Quaternions
    character.traverse((child) => {
        if (child.isBone) {
            const worldQuaternion = new THREE.Quaternion();
            const worldPosition = new THREE.Vector3();
            const worldScale = new THREE.Vector3();
            
            // Decompose the 4x4 matrix into pure World Space Global Rotation
            child.matrixWorld.decompose(worldPosition, worldQuaternion, worldScale);
            defaultGlobalQuaternions[child.name] = worldQuaternion.clone();
        }
    });
    
    // STEP 3: Apply your formula: R_local = R_parent_global^-1 * R_child_global
    character.traverse((child) => {
        if (child.isBone) {
            const q_child_global = defaultGlobalQuaternions[child.name];
            const parent = child.parent;
            
            // Check if the parent is also a bone we extracted
            if (parent && parent.isBone && defaultGlobalQuaternions[parent.name]) {
                const q_parent_global = defaultGlobalQuaternions[parent.name];
                
                // Math: Inverse(Parent_Global) * Child_Global
                const q_local = q_parent_global.clone().invert().multiply(q_child_global);
                // print parent name 
                console.log(`Calculating Local Quaternion for ${child.name} (Parent: ${parent.name})`);
                
                calculatedLocalQuaternions[child.name] = q_local;
            } else {
                // If this is the absolute root bone (Hips), it has no parent.
                // Therefore, its Global rotation IS its Local rotation.
                calculatedLocalQuaternions[child.name] = q_child_global.clone();
            }
        }
    });

    console.log("Successfully calculated local blueprints from global math!");
    checkLoadComplete();
});

// Load JSON
fetch('./iteration-9-apple-quats.json')
    .then(response => response.json())
    .then(data => {
        animationData = data; 
        checkLoadComplete();
    })
    .catch(err => {
        document.getElementById("status").innerText = "❌ Error Loading Data";
        console.error(err);
    });

// ==========================================
// 5. CORE ARCHITECTURE: SINGLE SOURCE OF TRUTH
// ==========================================
const DOM = {
    slider: document.getElementById("frameSlider"),
    lblFrame: document.getElementById("frameLabel"),
    lblTime: document.getElementById("timeLabel"),
    btnPlay: document.getElementById("btnPlayPause")
};

function updateFrame(requestedFrame) {
    if (!state.isLoaded) return;

    // 1. Clamp Frame mathematically
    if (requestedFrame > state.maxFrame) {
        requestedFrame = 0; // Loop playback
    } else if (requestedFrame < 0) {
        requestedFrame = state.maxFrame; // Reverse loop
    }
    
    // Update global state
    state.currentFrame = requestedFrame;

    // 2. Update UI
    if (CONFIG.debugMode) {
        DOM.slider.value = state.currentFrame;
        DOM.lblFrame.innerText = `Frame: ${state.currentFrame}`;
        DOM.lblTime.innerText = `${(state.currentFrame * CONFIG.frameTime).toFixed(2)}s`;
        DOM.btnPlay.innerText = state.isPlaying ? "⏸️ Pause" : "▶️ Play";
    }

    // 3. Inject Math into 3D Mesh
   // 3. Inject Math into 3D Mesh
    rigMap.forEach(mapping => {
        if (animationData[mapping.jsonKey] && animationData[mapping.jsonKey][state.currentFrame]) {
            const meshBone = character.getObjectByName(mapping.targetName);
            if (meshBone) {
                // Python's raw output (The Delta)
                const q = animationData[mapping.jsonKey][state.currentFrame];
                const q_val = new THREE.Quaternion(q[0], q[1], q[2], q[3]);
                
                // Grab the structural blueprints we mathematically calculated earlier!
                const q_default_local = calculatedLocalQuaternions[mapping.targetName];
                const q_default_global = defaultGlobalQuaternions[mapping.targetName];

                if (mapping.jsonKey.includes("GlobalRotations")) {
                    // ==========================================
                    // THE SHOULDERS (Global to Local Conversion)
                    // ==========================================
                    const parent = meshBone.parent;
                    if (parent && parent.isBone && defaultGlobalQuaternions[parent.name]) {
                        const q_parent_global = defaultGlobalQuaternions[parent.name];
                        
                        // 1. Calculate Target Global: Default Global * Python Global Delta
                        const q_target_global = q_val.clone().multiply(q_default_global);
                        
                        // 2. Convert to Local: Inverse(Parent Global) * Target Global
                        const q_final_local = q_parent_global.clone().invert().multiply(q_target_global);
                        
                        meshBone.quaternion.copy(q_final_local);
                    }
                } else {
                    // ==========================================
                    // THE ARMS & FINGERS (Your Local Formula)
                    // ==========================================
                    if (q_default_local && q_default_global) {
                        // 1. TRANSLATE the Python Delta into the GLB's weird local axes
                        // Math: Q_translated_delta = Q_default_global^-1 * Q_val * Q_default_global
                        const q_translated_delta = q_default_global.clone().invert().multiply(q_val).multiply(q_default_global);
                        
                        // 2. APPLY YOUR FORMULA! Final = Default_Local * Translated_Delta
                        const q_final_local = q_default_local.clone().multiply(q_translated_delta);
                        
                        // 3. Apply the final calculated quaternion to the mesh
                        meshBone.quaternion.copy(q_final_local);
                    }
                }
            }
        }
    });
}

// ==========================================
// 6. ENGINE TIMING & RENDER LOOP       
// ==========================================
const clock = new THREE.Clock();
let timeAccumulator = 0;

function renderLoop() {
    requestAnimationFrame(renderLoop);

    // Engine logic: Only step forward if playing and fully loaded
    if (state.isLoaded && state.isPlaying) {
        timeAccumulator += clock.getDelta();
        
        // Strict 25 FPS pacing
        if (timeAccumulator >= CONFIG.frameTime) {
            timeAccumulator -= CONFIG.frameTime;
            updateFrame(state.currentFrame + 1);
        }
    } else {
        // Keep clock burning so delta doesn't explode when unpaused
        clock.getDelta(); 
    }

    // Camera and Scene Render (Runs full speed for smooth orbiting)
    controls.update();
    renderer.render(scene, camera);
    
}

// Start the loop immediately
renderLoop();

// ==========================================
// 7. RECORDING SYSTEM
// ==========================================
let mediaRecorder;
let recordedChunks = [];

function toggleRecording() {
    if (!state.isLoaded) return;
    
    const btnRecord = document.getElementById("btnRecord");

    if (!state.isRecording) {
        // START RECORDING
        recordedChunks = [];
        const stream = renderer.domElement.captureStream(CONFIG.fps); 
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };
        
        mediaRecorder.start();
        state.isRecording = true;
        
        // UI Updates
        btnRecord.innerText = "⏹️ Stop Recording (R)";
        btnRecord.classList.add("recording-active");
        
        // Optional: Force play from frame 0 when recording starts
        // updateFrame(0);
        // state.isPlaying = true;
        
    } else {
        // STOP RECORDING
        mediaRecorder.stop();
        state.isRecording = false;
        
        // UI Updates
        btnRecord.innerText = "⏺️ Start Recording (R)";
        btnRecord.classList.remove("recording-active");
        document.getElementById("status").innerText = "✅ Video Ready to Save! Press (S)";
    }
}

function saveVideo() {
    if (recordedChunks.length === 0 || state.isRecording) {
        alert("Please finish recording a clip first!");
        return;
    }
    
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = `isl_avatar_export_${CONFIG.fps}fps.webm`;
    document.body.appendChild(a);
    a.click();
    URL.revokeObjectURL(url);
    
    document.getElementById("status").innerText = "✅ Video Downloaded!";
}

// ==========================================
// 8. EVENT LISTENERS
// ==========================================

// Play/Pause State Management
function togglePlay() {
    state.isPlaying = !state.isPlaying;
    timeAccumulator = 0; // Prevent skipping frames on unpause
    updateFrame(state.currentFrame); // Refresh UI
}

// UI Buttons
document.getElementById("btnPlayPause").addEventListener("click", togglePlay);
document.getElementById("btnPrev").addEventListener("click", () => { state.isPlaying = false; updateFrame(state.currentFrame - 1); });
document.getElementById("btnNext").addEventListener("click", () => { state.isPlaying = false; updateFrame(state.currentFrame + 1); });
document.getElementById("btnRecord").addEventListener("click", toggleRecording);
document.getElementById("btnSave").addEventListener("click", saveVideo);

// Timeline Scrubbing
DOM.slider.addEventListener("input", (e) => {
    state.isPlaying = false;
    updateFrame(parseInt(e.target.value));
});

// Keyboard Shortcuts
window.addEventListener("keydown", (e) => {               
    if (!state.isLoaded) return;
    
    switch(e.code) {
        case "Space": 
            e.preventDefault(); 
            togglePlay(); 
            break;
        case "ArrowLeft": 
            state.isPlaying = false; 
            updateFrame(state.currentFrame - 1); 
            break;
        case "ArrowRight": 
            state.isPlaying = false; 
            updateFrame(state.currentFrame + 1); 
            break;
        case "KeyR": 
            toggleRecording(); 
            break;
        case "KeyS": 
            saveVideo(); 
            break;
    }
});

// Window Resize Handling
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
